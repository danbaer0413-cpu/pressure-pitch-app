name: Update data

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install pybaseball pandas numpy requests

      - name: Restore raw Statcast cache
        uses: actions/cache@v4
        with:
          path: statcast_2026_raw.csv.gz
          key: statcast-${{ github.run_id }}
          restore-keys: statcast-

      - name: Build data
        run: python build_master.py

      - name: Save updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add all_mlb_rosters_2026.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update data"
            git push
          fi
